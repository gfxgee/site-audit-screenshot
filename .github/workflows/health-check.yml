name: Website Homepage Audit

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is always UTC. The Philippines is UTC+8, so subtract 8 hours
    # from the local time you want:
    #   10:00 PHT = 02:00 UTC  <- current setting
    #   08:00 PHT = 00:00 UTC   |   12:00 PHT = 04:00 UTC
    #
    # The minute is deliberately not :00. GitHub queues scheduled jobs and the
    # top of the hour is the most contended slot - this repo's runs on
    # '0 0 * * *' consistently started ~4 hours late. An off-peak minute
    # reduces that. GitHub still makes no delivery-time guarantee, so if runs
    # remain persistently late, shift this cron earlier to compensate.
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Audit homepages
        run: npm run check
        env:
          # The API key is the only real secret here. It is exposed only to
          # this step and is never echoed. A missing key skips the email; the
          # audit and its artifacts still run.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          # Recipients and sender are plain configuration, so they live in
          # Actions *variables* (Settings -> Secrets and variables -> Actions
          # -> Variables), where they stay readable and editable. A secret
          # named EMAIL_TO still works as a fallback if one already exists.
          EMAIL_TO: ${{ vars.EMAIL_TO || secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-audit-results-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
