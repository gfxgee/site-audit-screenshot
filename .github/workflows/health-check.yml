name: Website Homepage Audit

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 00:00 UTC is 08:00 in the Philippines (UTC+8).
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Audit homepages
        run: npm run check
        env:
          # Secrets are exposed only to this step and are never echoed.
          # A missing key skips the email; the audit and artifacts still run.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional: set an EMAIL_FROM variable once a domain is verified in
          # Resend. Defaults to Resend's onboarding@resend.dev test sender.
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-audit-results-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
