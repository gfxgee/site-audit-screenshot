name: Website Homepage Audit

on:
  workflow_dispatch:
  schedule:
    # TARGET: the report should land around 10:00 Philippine time (UTC+8).
    #
    # This cron is NOT 10:00 PHT converted to UTC. GitHub queues scheduled
    # workflows and starts them late, and for this repository the delay has
    # been large and consistent:
    #
    #   cron 00:00 UTC -> ran 03:58, 04:01, 04:04, 04:05 UTC  (~4h late)
    #   cron 02:17 UTC -> ran 07:23 UTC = 15:23 PHT           (5h06m late)
    #
    # So the nominal time is set ~5 hours EARLIER than the wanted time to
    # absorb that queue delay:
    #
    #   21:17 UTC nominal (= 05:17 PHT) + ~4-5h observed delay = ~09:15-10:30 PHT
    #
    # Note this fires on the PREVIOUS UTC day, which is fine for a daily run.
    # The minute stays off :00, the most contended slot in the queue.
    #
    # GitHub guarantees no start time, so this is compensation, not precision.
    # If the delay shrinks, the report arrives early (down to 05:17 PHT); if it
    # grows, later. Re-measure with:
    #   gh run list --workflow=health-check.yml --json event,createdAt
    # and shift the hour accordingly. For a genuinely punctual 10:00, trigger
    # workflow_dispatch from an external scheduler instead of using cron.
    - cron: '17 21 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Audit homepages
        run: npm run check
        env:
          # The API key is the only real secret here. It is exposed only to
          # this step and is never echoed. A missing key skips the email; the
          # audit and its artifacts still run.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          # Recipients and sender are plain configuration, so they live in
          # Actions *variables* (Settings -> Secrets and variables -> Actions
          # -> Variables), where they stay readable and editable. A secret
          # named EMAIL_TO still works as a fallback if one already exists.
          EMAIL_TO: ${{ vars.EMAIL_TO || secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-audit-results-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
